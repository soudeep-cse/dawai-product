services:
  postgres:
    image: postgres:16-alpine
    container_name: dawai-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-dawai_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dawai_pass}
      POSTGRES_DB: ${DB_NAME:-dawai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dawai_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dawai-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-dawai_user}:${DB_PASSWORD:-dawai_pass}@postgres:5432/${DB_NAME:-dawai}"
      NODE_ENV: "production"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SMS_API_KEY: ${SMS_API_KEY}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-DAWAI}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./public/uploads:/app/public/uploads
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
