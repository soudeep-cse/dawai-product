name: Deploy to VPS

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        env:
          DB_USER: ${{ secrets.DB_USER || 'dawai_user' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME || 'dawai' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_USER,DB_PASSWORD,DB_NAME,JWT_SECRET,NEXT_PUBLIC_APP_URL,OPENAI_API_KEY,NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,FIREBASE_PROJECT_ID,FIREBASE_CLIENT_EMAIL,FIREBASE_PRIVATE_KEY
          script: |
            set -e
            echo "🚀 Starting deployment..."

            # Clone if not exists, pull if exists
            if [ ! -d "/opt/dawai-website" ]; then
              echo "📥 First deployment: cloning repository..."
              sudo git clone https://github.com/soudeep-cse/dawai-product.git /opt/dawai-website
              sudo chown -R ubuntu:ubuntu /opt/dawai-website
            else
              echo "📥 Pulling latest code..."
              cd /opt/dawai-website
              git pull origin main
            fi

            # Navigate to project directory
            cd /opt/dawai-website

            # Create .env.local from secrets (always create fresh)
            echo "⚙️  Creating .env.local from environment variables..."
            {
              echo "DATABASE_URL=postgresql://$DB_USER:$DB_PASSWORD@postgres:5432/$DB_NAME"
              echo "DB_USER=$DB_USER"
              echo "DB_PASSWORD=$DB_PASSWORD"
              echo "DB_NAME=$DB_NAME"
              echo "NODE_ENV=production"
              echo "JWT_SECRET=$JWT_SECRET"
              echo "NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL"
              echo "OPENAI_API_KEY=$OPENAI_API_KEY"
              echo "NEXT_PUBLIC_FIREBASE_API_KEY=$NEXT_PUBLIC_FIREBASE_API_KEY"
              echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN"
              echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=$NEXT_PUBLIC_FIREBASE_PROJECT_ID"
              echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET"
              echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID"
              echo "NEXT_PUBLIC_FIREBASE_APP_ID=$NEXT_PUBLIC_FIREBASE_APP_ID"
              echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
              echo "FIREBASE_CLIENT_EMAIL=$FIREBASE_CLIENT_EMAIL"
              echo "FIREBASE_PRIVATE_KEY=$FIREBASE_PRIVATE_KEY"
              echo "MAX_FILE_SIZE=5242880"
              echo "UPLOAD_DIR=public/uploads"
            } > .env.local

            # Create backups directory
            mkdir -p backups

            # Stop and remove old containers
            echo "🛑 Stopping containers..."
            docker compose -f docker-compose.vps.yml down || true

            # Build and start new containers
            # Note: migrations run automatically inside the container's own
            # CMD (see Dockerfile) before Next.js boots - do NOT also run
            # `prisma migrate deploy` from here, it races the container's
            # own migration run for the same lock and spikes memory on
            # small instances.
            echo "🔨 Building and starting containers..."
            docker compose -f docker-compose.vps.yml up -d --build

            # Wait for the app to be healthy - this only turns green once
            # the container's internal migrate+boot sequence has finished
            echo "🏥 Waiting for app to be healthy (migrations run internally)..."
            MAX_ATTEMPTS=60
            ATTEMPT=0
            while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              if curl -f http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "✅ App health check passed"
                break
              fi
              ATTEMPT=$((ATTEMPT + 1))
              echo "Waiting for app to be healthy... ($ATTEMPT/$MAX_ATTEMPTS)"
              sleep 3
            done

            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "❌ App did not become healthy in time"
              docker compose -f docker-compose.vps.yml logs app | tail -50
              exit 1
            fi

            # Check if this is first deployment (no admin user exists)
            # Note: Prisma creates tables with quoted PascalCase names, so "Admin" must be quoted
            ADMIN_EXISTS=$(docker compose -f docker-compose.vps.yml exec -T postgres psql -U "${DB_USER:-dawai_user}" -d "${DB_NAME:-dawai}" -t -c "SELECT COUNT(*) FROM \"Admin\" WHERE email='admin@dawai.com';" | tr -d '[:space:]')

            if [ "$ADMIN_EXISTS" -eq "0" ]; then
              echo "👨‍💼 First deployment: seeding database..."
              docker compose -f docker-compose.vps.yml exec -T app node scripts/seed-admin.js
              docker compose -f docker-compose.vps.yml exec -T app node scripts/seed-final-categories.js
            else
              echo "✅ Database already seeded"
            fi

            # Delivery zones seed is upsert-based (idempotent) - safe to run every deploy
            echo "🚚 Ensuring delivery zones are seeded..."
            docker compose -f docker-compose.vps.yml exec -T app node scripts/seed-delivery-zones.js

            # Show status
            echo "📊 Deployment status:"
            docker compose -f docker-compose.vps.yml ps

            echo "✅ Deployment completed successfully!"

      - name: Deployment Status
        if: always()
        run: echo "Deployment status can be checked at VPS"
