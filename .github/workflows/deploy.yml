name: Deploy to VPS

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting deployment..."

            # Navigate to project directory
            cd /opt/dawai-website

            # Pull latest code
            echo "📥 Pulling latest code..."
            git pull origin main

            # Create backups directory
            mkdir -p backups

            # Stop and remove old containers
            echo "🛑 Stopping containers..."
            docker compose -f docker-compose.vps.yml down || true

            # Build and start new containers
            echo "🔨 Building and starting containers..."
            docker compose -f docker-compose.vps.yml up -d --build

            # Wait for database to be ready
            echo "⏳ Waiting for database..."
            sleep 10

            # Run migrations
            echo "🔄 Running database migrations..."
            docker compose -f docker-compose.vps.yml exec -T app npx prisma migrate deploy || echo "Migrations already up to date"

            # Check if this is first deployment (no admin user exists)
            ADMIN_EXISTS=$(docker compose -f docker-compose.vps.yml exec -T postgres psql -U ${DB_USER:-dawai_user} -d ${DB_NAME:-dawai} -t -c "SELECT COUNT(*) FROM admin WHERE email='admin@dawai.com';" || echo "0")

            if [ "$ADMIN_EXISTS" -eq "0" ]; then
              echo "👨‍💼 First deployment: seeding database..."
              docker compose -f docker-compose.vps.yml exec -T app node scripts/seed-admin.js
              docker compose -f docker-compose.vps.yml exec -T app node scripts/seed-final-categories.js
            else
              echo "✅ Database already seeded"
            fi

            # Health check
            echo "🏥 Running health checks..."
            MAX_ATTEMPTS=30
            ATTEMPT=0
            while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              if curl -f http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "✅ App health check passed"
                break
              fi
              ATTEMPT=$((ATTEMPT + 1))
              echo "Waiting for app to be healthy... ($ATTEMPT/$MAX_ATTEMPTS)"
              sleep 2
            done

            # Show status
            echo "📊 Deployment status:"
            docker compose -f docker-compose.vps.yml ps

            echo "✅ Deployment completed successfully!"

      - name: Deployment Status
        if: always()
        run: echo "Deployment status can be checked at VPS"
