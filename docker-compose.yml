version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: dawai-db
    restart: always
    environment:
      POSTGRES_USER: dawai_user
      POSTGRES_PASSWORD: dawai_pass
      POSTGRES_DB: dawai
    ports:
      - "5432:5432"
    volumes:
      - dawai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dawai_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dawai_pgdata:
